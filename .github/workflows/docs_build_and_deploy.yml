name: Build Sphinx docs and deploy to GitHub Pages

# Builds the documentation on every push to main, on pull requests (as a
# check that it still builds) and by manual dispatch. On pushes to main, the
# site is moved to the gh-pages branch, which GitHub Pages publishes at
# https://learningcircuitslab.github.io/lecilab-behavior-analysis/
# The example figures are drawn from tests/data by the current code at every
# build (docs/source/make_examples.py).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/lint@v2

  build_sphinx_docs:
    name: Build Sphinx Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # for the version number (setuptools-scm)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and the docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build Sphinx HTML
        run: sphinx-build -b html docs/source docs/build

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: ./docs/build/

  deploy_sphinx_docs:
    name: Deploy Sphinx Docs
    needs: build_sphinx_docs
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: neuroinformatics-unit/actions/deploy_sphinx_docs@v2
        with:
          secret_input: ${{ secrets.GITHUB_TOKEN }}
